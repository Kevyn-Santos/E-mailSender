[project]
name = "email-sender-sdk"
version = "0.1.0"
description = "Cliente Python para a API multi-tenant de envio de e-mails"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["email_sender_sdk*"]
