[project]
name = "email-sender"
version = "0.1.0"
description = "Serviço REST modular em FastAPI para envio de e-mails padronizados via SMTP-SSL, executável como múltiplos contêineres (cadastro, promoção, redefinição de senha) a partir da mesma imagem Docker."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.124.2",
    "uvicorn==0.38.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "email-validator==2.3.0",
    "slowapi==0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "coverage==7.14.3",
    "ruff==0.15.20",
    "python-dotenv==1.2.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["scripts/tests"]
addopts = "--cov=src --cov-report=term --cov-fail-under=70"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
